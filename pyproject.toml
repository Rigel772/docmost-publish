[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmost-folder-publisher"
version = "1.0.0"
description = "Rebuild a Docmost page tree from a local Markdown folder using a cached login session"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests==2.32.5",
  "PyYAML==6.0.3",
  "mistune==3.2.1",
]

[project.scripts]
docmost-publish = "docmost_publisher.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
